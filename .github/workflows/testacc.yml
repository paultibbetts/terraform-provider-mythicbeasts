# Terraform Provider acceptance testing workflow.
name: Acceptance Tests

# Run acceptance tests for release candidates.
on:
  push:
    tags:
      - 'v*-rc*'

permissions:
  contents: read

jobs:
  testacc:
    name: Terraform Provider Acceptance Tests
    runs-on: ubuntu-latest
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        terraform:
          - '1.11.*'
          # - '1.12.*'
          # - '1.13.*'
          # - '1.14.*'
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: 'go.mod'
          cache: true
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ matrix.terraform }}
          terraform_wrapper: false
      - run: go mod download
      - name: Check required acceptance test secrets
        env:
          MYTHICBEASTS_KEYID: ${{ secrets.MYTHICBEASTS_KEYID }}
          MYTHICBEASTS_SECRET: ${{ secrets.MYTHICBEASTS_SECRET }}
          MB_TEST_PROXY_DOMAIN: ${{ secrets.MB_TEST_PROXY_DOMAIN }}
        run: |
          test -n "$MYTHICBEASTS_KEYID" || (echo "Missing MYTHICBEASTS_KEYID secret"; exit 1)
          test -n "$MYTHICBEASTS_SECRET" || (echo "Missing MYTHICBEASTS_SECRET secret"; exit 1)
          test -n "$MB_TEST_PROXY_DOMAIN" || (echo "Missing MB_TEST_PROXY_DOMAIN secret"; exit 1)
      - name: Run acceptance tests
        env:
          TF_ACC: "1"
          MYTHICBEASTS_KEYID: ${{ secrets.MYTHICBEASTS_KEYID }}
          MYTHICBEASTS_SECRET: ${{ secrets.MYTHICBEASTS_SECRET }}
          MB_TEST_PROXY_DOMAIN: ${{ secrets.MB_TEST_PROXY_DOMAIN }}
        run: make testacc
